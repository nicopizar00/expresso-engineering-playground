apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: http-cart
  description: Reserve carts, no checkout
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6
  k6:
    script: /scripts/scenarios/http-cart/http-cart.js
  environment:
    forward: [BASE_URL, VUS, DURATION, ITERATIONS]
  outputs:
    summary:
      path: tests/performance/k6/reports/http-cart-summary.json
  data:
    directory: tests/performance/k6/data
    mountedAt: /scripts/data
    produces:
      - dataset: carts
        columns: [cartId, productId, sid]
        targets: [http-orders]
        recommended: true
