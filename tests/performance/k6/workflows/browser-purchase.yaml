apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: browser-purchase
  description: Full purchase in Chromium
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6-browser
  k6:
    script: /scripts/scenarios/browser-purchase/browser-purchase.js
  environment:
    forward: [BASE_URL, VUS, ITERATIONS]
  outputs:
    summary:
      path: tests/performance/k6/reports/browser-purchase-summary.json
  data:
    directory: tests/performance/k6/data
    mountedAt: /scripts/data
    produces:
      - dataset: orders
        columns: [orderId]
        targets: [http-orders-status]
