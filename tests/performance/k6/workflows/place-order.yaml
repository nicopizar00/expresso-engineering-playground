apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: place-order
  description: Check out reserved carts into orders.
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6
  k6:
    script: /scripts/scenarios/place-order/place-order.js
  environment:
    forward: [BASE_URL, VUS, ITERATIONS]
  outputs:
    summary:
      path: tests/performance/k6/reports/place-order-summary.json
  data:
    directory: tests/performance/k6/data
    mountedAt: /scripts/data
    produces:
      - dataset: orders
        columns: [orderId]
        targets: [order-status]
    requires: [carts]
