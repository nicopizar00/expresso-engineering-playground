apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: smoke
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6
  k6:
    script: /scripts/scenarios/smoke/smoke.js
  environment:
    forward: [BASE_URL]
  outputs:
    summary:
      path: tests/performance/k6/reports/smoke-summary.json
