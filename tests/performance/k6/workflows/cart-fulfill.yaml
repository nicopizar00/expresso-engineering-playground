apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: cart-fulfill
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6
  k6:
    script: /scripts/scenarios/cart-fulfill/cart-fulfill.js
  environment:
    forward: [BASE_URL, VUS, DURATION, ITERATIONS]
  outputs:
    summary:
      path: tests/performance/k6/reports/cart-fulfill-summary.json
  data:
    directory: tests/performance/k6/data
    mountedAt: /scripts/data
    produces:
      - dataset: carts
        columns: [cartId, productId, sid]
        targets: [place-order]
