apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: purchase-flow
  description: Full purchase journey over HTTP, mirroring the web app.
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6
  k6:
    script: /scripts/scenarios/purchase-flow/purchase-flow.js
  environment:
    forward: [BASE_URL, VUS, DURATION, ITERATIONS]
  outputs:
    summary:
      path: tests/performance/k6/reports/purchase-flow-summary.json
  data:
    directory: tests/performance/k6/data
    mountedAt: /scripts/data
    produces:
      - dataset: orders
        columns: [orderId]
        targets: [order-status]
