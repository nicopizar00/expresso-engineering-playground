apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: http-orders
  description: Create orders from carts
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6
  k6:
    script: /scripts/scenarios/http-orders/http-orders.js
    config: tests/performance/k6/options/5-iterations.json
  environment:
    forward: [BASE_URL]
  outputs:
    summary:
      path: tests/performance/k6/reports/http-orders-summary.json
  data:
    directory: tests/performance/k6/data
    mountedAt: /scripts/data
    produces:
      - dataset: orders
        columns: [orderId]
        targets: [http-orders-status]
    requires: [carts]
  sizing:
    iterationSeconds: 1.1   # measured: 1 VU × 10 iterations, durationMs / 10
    maxSeconds: 270         # 30 s under the default config's 5m maxDuration
    margin: 0.15            # extra rows over the estimate (producer errors)
