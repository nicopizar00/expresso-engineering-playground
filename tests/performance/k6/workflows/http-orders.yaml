apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: http-orders
  description: Create orders from carts
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6
  k6:
    script: /scripts/scenarios/http-orders/http-orders.js
  environment:
    # TODO(next-steps/sizing-duration-targets): forward DURATION once the scenario runs time-based
    forward: [BASE_URL, VUS, ITERATIONS]
  outputs:
    summary:
      path: tests/performance/k6/reports/http-orders-summary.json
  data:
    directory: tests/performance/k6/data
    mountedAt: /scripts/data
    produces:
      - dataset: orders
        columns: [orderId]
        targets: [http-orders-status]
    requires: [carts]
  sizing:
    iterationSeconds: 1.1   # measured: VUS=1 ITERATIONS=10, durationMs / 10
    maxSeconds: 270         # 30 s under the scenario's 5m maxDuration
    margin: 0.15            # extra rows over the estimate (producer errors)
