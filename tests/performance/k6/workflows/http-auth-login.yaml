apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: http-auth-login
  description: Log in, capture tokens
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6
  k6:
    script: /scripts/scenarios/http-auth-login/http-auth-login.js
    config: tests/performance/k6/options/5-iterations.json
  environment:
    forward: [BASE_URL, DEMO_PASSWORD]
  outputs:
    summary:
      path: tests/performance/k6/reports/http-auth-login-summary.json
  data:
    directory: tests/performance/k6/data
    mountedAt: /scripts/data
    produces:
      - dataset: auth-tokens
        columns: [username, authToken]
        targets: [http-me-hot-status]
    optional: [owned-orders]
  sizing:
    iterationSeconds: 1.2   # measured: 1 VU × 10 iterations, durationMs / 10
    maxSeconds: 270         # 30 s under the default config's 5m maxDuration
    margin: 0.15            # extra rows over the estimate (producer errors)
