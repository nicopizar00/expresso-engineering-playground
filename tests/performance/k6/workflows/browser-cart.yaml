apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: browser-cart
  description: Reserve carts in Chromium
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6-browser
  k6:
    script: /scripts/scenarios/browser-cart/browser-cart.js
  environment:
    forward: [BASE_URL, VUS, ITERATIONS]
  outputs:
    summary:
      path: tests/performance/k6/reports/browser-cart-summary.json
  data:
    directory: tests/performance/k6/data
    mountedAt: /scripts/data
    produces:
      - dataset: carts
        columns: [cartId, productId, sid]
        targets: [http-orders]
  sizing:
    iterationSeconds: 2.7   # measured: VUS=1 ITERATIONS=10, durationMs / 10
    maxSeconds: 270         # 30 s under the scenario's 5m maxDuration
