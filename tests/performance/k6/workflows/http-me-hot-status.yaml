apiVersion: punch/v1
kind: K6Workflow
metadata:
  name: http-me-hot-status
  description: Poll hot-status banner
spec:
  workingDirectory: ../../../..
  compose:
    file: infra/docker/compose.performance.yaml
    service: k6
  k6:
    script: /scripts/scenarios/http-me-hot-status/http-me-hot-status.js
    config: tests/performance/k6/options/5-iterations.json
  environment:
    forward: [BASE_URL]
  outputs:
    summary:
      path: tests/performance/k6/reports/http-me-hot-status-summary.json
  data:
    directory: tests/performance/k6/data
    mountedAt: /scripts/data
    requires: [auth-tokens]
  sizing:
    iterationSeconds: 1.1   # measured: 1 VU × 10 iterations, durationMs / 10
    margin: 0.15            # extra rows over the estimate (producer errors)
