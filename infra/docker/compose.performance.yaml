# Performance testing profile for the mini-commerce playground.
#
# Kept in a separate compose file (not a profile of compose.yaml) so a
# perf run never alters the main local stack lifecycle. The `k6` and
# `k6-otel` services build this repo's own k6 image from
# infra/docker/k6.Dockerfile (esbuild compiles the TypeScript scenarios in)
# — there is no bare grafana/k6 image pulled directly; see the shared
# `k6-build` anchor below. `k6-browser` builds the separate
# infra/docker/k6-browser.Dockerfile instead, which layers the same
# scenarios onto grafana/k6's official Chromium-bundled "-with-browser" tag
# — the plain `k6`/`k6-otel` image stays bare on purpose.
#
# Quick start (use the wrapper command for the default invocation):
#   pnpm pg:perf:smoke
#
# Direct invocation (handy when iterating on a scenario):
#   docker compose -f infra/docker/compose.performance.yaml run --rm k6 \
#     run /scripts/scenarios/smoke/smoke.js
#
# OTLP-enabled invocation (requires the main stack to be up so the
# otel-collector and its network exist):
#   docker compose -f infra/docker/compose.yaml up -d otel-collector
#   docker compose -f infra/docker/compose.performance.yaml run --rm k6-otel
#
# Target resolution:
#   - BASE_URL defaults to http://host.docker.internal:3001 so the
#     container can reach the BFF running on the host.
#   - On Linux, host.docker.internal is not automatic — the `extra_hosts`
#     entry below maps it to the Docker host gateway. macOS/Windows
#     resolve it natively; the mapping is a no-op there.
#   - To target a non-host environment, override BASE_URL on the command
#     line, e.g. `BASE_URL=https://perf.example pnpm pg:perf:smoke`.

# Explicit project name — this file shares a directory with the main
# compose.yaml, and without a distinct name they'd collide on Docker's
# default (directory-derived) project name, causing orphan-container
# conflicts when both stacks are up at once.
name: mini-commerce-perf

services:
  k6:
    build: &k6-build
      context: ../../
      dockerfile: infra/docker/k6.Dockerfile
    container_name: mini-commerce-k6
    working_dir: /scripts
    # Scenarios are baked into the image at build time (Task 2); reports
    # and data need live mounts — reports so output lands on the host,
    # data so place-order's SharedArray sees cart-fulfill's freshly
    # duplicated CSV without an image rebuild in between runs.
    volumes:
      - ../../tests/performance/k6/reports:/scripts/reports
      - ../../tests/performance/k6/data:/scripts/data
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:3001}
      K6_ENV: ${K6_ENV:-local}
      # k6 defaults --log-output to stderr, so console.log() (cart-fulfill's
      # [CSV] records) never reaches the stdout stream Punch harvests unless
      # this is redirected. Confirmed live: without it, execution.py reports
      # "no [CSV] stdout records were produced" despite the lines firing.
      # Redirecting the stream alone isn't enough either: the default
      # logfmt format wraps every console.log line as
      # `time="..." level=info msg="[CSV] ..." source=console`, which no
      # longer starts with the literal "[CSV]" tag execution.py matches on —
      # "raw" format strips that wrapping back to the bare message.
      K6_LOG_OUTPUT: stdout
      K6_LOG_FORMAT: raw
      # No default: the orchestrator always passes an explicit script arg
      # (docker/entrypoint.sh -> scripts/k6-wrapper.sh forwards it as-is
      # unless SCENARIO is set). A hardcoded default here would silently
      # override whichever workflow was actually selected.
      SCENARIO: ${SCENARIO:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Opt-in variant that exports OTLP metrics to the otel-collector running
  # in the main stack (compose.yaml). Reuses the exact same built image as
  # `k6` (the `k6-build` anchor above — scenarios are baked in, not mounted)
  # so its /scripts/scenarios/smoke/smoke.js path is guaranteed to exist;
  # it differs from `k6` only in the K6_OTEL_* env wiring and the explicit
  # `--out experimental-opentelemetry` flag in the command. The default
  # pg:perf:smoke wrapper still uses the plain `k6` service; this service is
  # invoked manually when you want to see metrics land in the collector.
  k6-otel:
    build: *k6-build
    container_name: mini-commerce-k6-otel
    working_dir: /scripts
    volumes:
      - ../../tests/performance/k6/reports:/scripts/reports
      - ../../tests/performance/k6/data:/scripts/data
    command: run --out experimental-opentelemetry /scripts/scenarios/smoke/smoke.js
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:3001}
      K6_ENV: ${K6_ENV:-local}
      SCENARIO: ${SCENARIO:-}
      K6_OTEL_GRPC_EXPORTER_ENDPOINT: ${K6_OTEL_ENDPOINT:-otel-collector:4317}
      K6_OTEL_GRPC_EXPORTER_INSECURE: "true"
      K6_OTEL_SERVICE_NAME: "k6-mini-commerce"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - mini_commerce

  # Browser-driven variant of purchase-flow — drives the web app's real UI
  # with Chromium (k6/browser) instead of calling the BFF over HTTP, so its
  # target is the web app's port (3000), not the BFF's (3001) that `k6` and
  # `k6-otel` default to. shm_size is raised from Docker's 64 MB default —
  # standard headroom for a Chromium instance to avoid renderer crashes.
  k6-browser:
    build:
      context: ../../
      dockerfile: infra/docker/k6-browser.Dockerfile
    container_name: mini-commerce-k6-browser
    working_dir: /scripts
    shm_size: "512mb"
    volumes:
      - ../../tests/performance/k6/reports:/scripts/reports
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:3000}
      K6_ENV: ${K6_ENV:-local}
      # See the `k6` service's identical pair above: without these,
      # cart-fulfill-browser's [CSV] console.log records never reach the
      # stdout stream Punch harvests.
      K6_LOG_OUTPUT: stdout
      K6_LOG_FORMAT: raw
      SCENARIO: ${SCENARIO:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
  # External network created by infra/docker/compose.yaml. The k6-otel
  # service joins it so it can reach `otel-collector` by service name.
  # Important: this network only exists while the main stack is up — bring
  # the main stack up first (e.g. `docker compose -f infra/docker/compose.yaml
  # up -d otel-collector`) before invoking the `k6-otel` service, otherwise
  # Docker will refuse to start the container with a missing-network error.
  mini_commerce:
    name: mini_commerce_default
    external: true
