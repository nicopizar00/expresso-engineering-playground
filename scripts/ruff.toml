# Ruff settings for the Python orchestrator (scripts/pg). Lint rules stay at
# Ruff's defaults.

[lint.isort]
# pg.paths puts vendor/punch/src on sys.path, so every `punch` import must
# come after the `pg` imports. Listing punch as first-party keeps both in one
# section, where `pg` sorts before `punch`; as an unknown third-party package
# punch would be sorted above pg and fail to import.
known-first-party = ["pg", "punch"]
