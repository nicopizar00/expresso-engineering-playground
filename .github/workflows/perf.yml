name: perf

# On-demand Punch chain against the Expresso stack, both on this runner.
# Each step runs one workflow from tests/performance/k6/workflows/; a step's
# datasets feed the steps after it. `./dev perf:chain` plans, sizes, and runs
# the chain: docs/performance/orchestrator.md#chains-perfchain.
# scripts/pg/tests/test_perf_chain.py pins the options below to the catalog
# and the presets in tests/performance/k6/options/.

on:
  workflow_dispatch:
    inputs:
      step1:
        description: Step 1 workflow (reads no data)
        type: choice
        default: http-cart
        options:
          - browser-cart
          - browser-purchase
          - http-auth-login
          - http-cart
          - http-purchase
          - http-purchase-registered
      step1-shape:
        description: Step 1 load shape (auto sizes a writer for the step that reads its data)
        type: choice
        default: auto
        options:
          - auto
          - 1-iteration
          - 1-vu-5m
          - 5-iterations
          - 5-vu-5m
      step2:
        description: Step 2 workflow (none ends the chain)
        type: choice
        default: none
        options:
          - none
          - browser-cart
          - browser-purchase
          - http-auth-login
          - http-cart
          - http-me-hot-status
          - http-orders
          - http-orders-status
          - http-purchase
          - http-purchase-registered
      step2-shape:
        description: Step 2 load shape
        type: choice
        default: auto
        options:
          - auto
          - 1-iteration
          - 1-vu-5m
          - 5-iterations
          - 5-vu-5m
      step3:
        description: Step 3 workflow
        type: choice
        default: none
        options:
          - none
          - browser-cart
          - browser-purchase
          - http-auth-login
          - http-cart
          - http-me-hot-status
          - http-orders
          - http-orders-status
          - http-purchase
          - http-purchase-registered
      step3-shape:
        description: Step 3 load shape
        type: choice
        default: auto
        options:
          - auto
          - 1-iteration
          - 1-vu-5m
          - 5-iterations
          - 5-vu-5m
      step4:
        description: Step 4 workflow
        type: choice
        default: none
        options:
          - none
          - browser-cart
          - browser-purchase
          - http-auth-login
          - http-cart
          - http-me-hot-status
          - http-orders
          - http-orders-status
          - http-purchase
          - http-purchase-registered
      step4-shape:
        description: Step 4 load shape
        type: choice
        default: auto
        options:
          - auto
          - 1-iteration
          - 1-vu-5m
          - 5-iterations
          - 5-vu-5m

permissions:
  contents: read

jobs:
  chain:
    name: Punch chain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Inputs reach the shell as data, never as script text.
      CHAIN: >-
        ${{ inputs.step1 }}:${{ inputs.step1-shape }}
        ${{ inputs.step2 }}:${{ inputs.step2-shape }}
        ${{ inputs.step3 }}:${{ inputs.step3-shape }}
        ${{ inputs.step4 }}:${{ inputs.step4-shape }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Punch dependencies
        run: python -m pip install --quiet -r vendor/punch/requirements.txt
      - name: Plan the chain
        # Fails in seconds, before the stack starts, on an impossible chain.
        id: plan
        run: |
          read -ra steps <<< "$CHAIN"
          ./dev perf:chain --plan "${steps[@]}"
          if [[ "$CHAIN" == *browser-* ]]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start the stack
        env:
          TARGET: ${{ steps.plan.outputs.browser == 'true' && 'web' || '' }}
        run: |
          ./dev up ${TARGET:+"$TARGET"} || {
            echo "./dev up failed" >&2
            docker compose -f infra/docker/compose.yaml ps
            docker compose -f infra/docker/compose.yaml logs --tail=200
            exit 1
          }
      - name: Build k6 images
        env:
          SERVICES: ${{ steps.plan.outputs.browser == 'true' && 'k6 k6-browser' || 'k6' }}
        run: |
          read -ra services <<< "$SERVICES"
          docker compose -f infra/docker/compose.performance.yaml build "${services[@]}"
      - name: Let k6 write its reports
        # k6 runs as uid 12345 in its container; the checkout belongs to the
        # runner user, so handleSummary() could not write here.
        run: chmod a+w tests/performance/k6/reports
      - name: Run the chain
        run: |
          read -ra steps <<< "$CHAIN"
          ./dev perf:chain "${steps[@]}"
      - name: Job summary
        if: always()
        run: |
          summary=tests/performance/k6/reports/chain/summary.md
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-chain-${{ github.run_id }}
          path: tests/performance/k6/reports/
          if-no-files-found: ignore
      - name: Tear down the stack
        if: always()
        run: ./dev down
