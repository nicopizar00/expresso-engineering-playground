name: Punch performance — job

# Run one Punch job that reads no earlier step's data, at one workload,
# against the Expresso stack on this runner. ./dev perf:forms --write
# generates the marked option blocks from the job catalog and the
# committed k6 options; _perf-execute.yml validates, runs, and records the run:
# docs/performance/orchestrator.md#github-actions-perf-job-and-perf-workflow.

run-name: "perf-job: ${{ inputs.job }} (${{ inputs.workload }}) by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job
        type: choice
        default: http-purchase
        options:
          # BEGIN perf:forms jobs
          - "browser-cart"
          - "browser-purchase"
          - "http-auth-login"
          - "http-cart"
          - "http-purchase"
          - "http-purchase-registered"
          # END perf:forms jobs
      workload:
        description: Workload (browser jobs run the -browser preset and refuse the 5-minute workloads)
        type: choice
        default: 1 journey
        options:
          # BEGIN perf:forms workloads
          - "1 journey"
          - "5 journeys"
          - "1 user for 5 minutes"
          - "5 users for 5 minutes"
          - "Custom: custom/status-regression.json"
          # END perf:forms workloads

permissions:
  contents: read

jobs:
  run:
    name: Punch job
    uses: ./.github/workflows/_perf-execute.yml
    with:
      kind: job
      selection: ${{ inputs.job }}
      workload: ${{ inputs.workload }}
