name: Punch performance — workflow

# Run one producer/consumer Punch workflow against the Expresso stack on this
# runner; each step reads the datasets earlier steps wrote. The workload is the
# last step's load. With data sizing on, every earlier step is sized for the
# step that reads its data; with it off, every step runs the workload. The list
# holds only Punch workflows the catalog links and perf:workflow plans:
# ./dev perf:forms --write generates the marked option blocks.
# _perf-execute.yml validates, runs, and records the run:
# docs/performance/orchestrator.md#github-actions-perf-job-and-perf-workflow.

run-name: "perf-workflow: ${{ inputs.workflow }} (${{ inputs.workload }}${{ !inputs.sizing && ', no data sizing' || '' }}) by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Workflow
        type: choice
        default: http-cart -> http-orders
        options:
          # BEGIN perf:forms workflows
          - "browser-cart -> http-orders"
          - "browser-cart -> http-orders -> http-orders-status"
          - "browser-purchase -> http-orders-status"
          - "http-auth-login -> http-me-hot-status"
          - "http-cart -> http-orders"
          - "http-cart -> http-orders -> http-orders-status"
          - "http-purchase -> http-orders-status"
          - "http-purchase-registered -> http-auth-login"
          - "http-purchase-registered -> http-auth-login -> http-me-hot-status"
          # END perf:forms workflows
      workload:
        description: Workload for the last step, or for every step with data sizing off (browser steps refuse more than 4 VUs and the 5-minute workloads)
        type: choice
        default: 5 journeys
        options:
          # BEGIN perf:forms workloads
          - "1 journey"
          - "5 journeys"
          - "1 user for 5 minutes"
          - "5 users for 5 minutes"
          - "Custom: custom/status-regression.json"
          # END perf:forms workloads
      sizing:
        description: Data sizing (each earlier step is sized for the next; the last runs the workload)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    name: Punch workflow
    uses: ./.github/workflows/_perf-execute.yml
    with:
      kind: workflow
      selection: ${{ inputs.workflow }}
      workload: ${{ inputs.workload }}
      sizing: ${{ inputs.sizing }}
